name: ci
on:
  pull_request:
  workflow_call: # release.yml runs it on every push to main (and weekly) before publishing

permissions:
  contents: read

# PRs: a new push cancels the older CI run. Called from release.yml: one group
# per run (github.workflow would be the caller's name there, so release runs
# for consecutive merges would share - and cancel within - one group).
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  image:
    name: image (${{ matrix.variant }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: stable
            dockerfile: Dockerfile
          - variant: preview
            dockerfile: Dockerfile.preview
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build (the Dockerfile's own smoke test fails the build if mcp-proxy cannot import)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          load: true
          no-cache: true # "preview" must always resolve the newest releases
          tags: mcp-manager:ci
      - name: Smoke test (initialize via allowed Host, 421 for unknown Host)
        run: scripts/smoke-test.sh mcp-manager:ci
      - name: mcp-supervise end-to-end (restart on memory/age/crash, stop/start, idle-stop)
        run: python3 tests/supervise-test.py mcp-manager:ci
      - name: mcp-manager end-to-end (admin API, per-server files, live edit, proxy restart)
        run: python3 tests/manager-test.py mcp-manager:ci

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: shellcheck entrypoint.sh scripts/*.sh
      - run: python3 -m py_compile mcp-supervise.py mcp-manager.py tests/*.py
