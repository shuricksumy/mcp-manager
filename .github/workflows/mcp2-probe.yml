name: mcp2-probe
# Weekly check: does the newest mcp-proxy work with the mcp 2.x SDK yet?
# Builds Dockerfile.next with MCP_SPEC="mcp>=2" and runs the smoke test.
# A failure is expected until mcp-proxy supports mcp 2 and does NOT fail the run.
# The first success opens an issue, so you know when to switch :next to mcp 2.
on:
  schedule:
    - cron: "41 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write # open the "mcp 2 works" issue
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - id: build
        continue-on-error: true
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.next
          build-args: MCP_SPEC=mcp>=2
          platforms: linux/amd64
          load: true
          no-cache: true
          tags: mcp-proxy-stack:mcp2
      - id: smoke
        if: steps.build.outcome == 'success'
        continue-on-error: true
        run: scripts/smoke-test.sh mcp-proxy-stack:mcp2
      - name: Report
        run: |
          if [ "$BUILD" = success ] && [ "$SMOKE" = success ]; then
            versions="$(docker run --rm --entrypoint cat mcp-proxy-stack:mcp2 /etc/mcp-proxy.versions)"
            echo "### mcp 2 works: ${versions}" >> "$GITHUB_STEP_SUMMARY"
            title="mcp-proxy now works with mcp 2.x"
            if [ -z "$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[].number')" ]; then
              gh issue create --title "$title" --body "The weekly probe built Dockerfile.next with \`MCP_SPEC=mcp>=2\` and the smoke test passed: \`${versions}\`.

          Next steps: set \`MCP_SPEC=mcp>=2\` for the :next image (or wait for mcp-proxy to lift its own \`mcp<2\` cap), test it, then drop \`--with mcp<2.0.0\` from servers that support mcp 2.

          Run: ${RUN_URL}"
            fi
          else
            echo "### mcp 2 not supported yet (build: ${BUILD}, smoke test: ${SMOKE:-skipped})" >> "$GITHUB_STEP_SUMMARY"
          fi
        env:
          BUILD: ${{ steps.build.outcome }}
          SMOKE: ${{ steps.smoke.outcome }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
