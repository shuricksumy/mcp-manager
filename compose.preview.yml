# "preview" stack (:preview): newest mcp-proxy, separate config, separate ports.
# Runs side by side with the stable stack (compose.yml).
#
#   cp .env.preview.example .env.preview
#   cp data/mcp-preview/servers.json.example data/mcp-preview/servers.json
#   docker compose -f compose.preview.yml --env-file .env.preview pull   # prebuilt :preview (rebuilt weekly)
#   docker compose -f compose.preview.yml --env-file .env.preview up -d
#
# To build locally instead (e.g. with MCP_SPEC=mcp>=2), use `build --no-cache`:
# the default MCP_PROXY_SPEC is unpinned, and without --no-cache Docker reuses
# the cached layer instead of fetching the newest release.
name: mcp-manager-preview

services:
  mcp-manager-preview:
    build:
      context: .
      dockerfile: Dockerfile.preview
      args:
        MCP_PROXY_SPEC: ${MCP_PROXY_SPEC:-mcp-proxy}
        MCP_SPEC: ${MCP_SPEC:-}
        UV_VERSION: ${UV_VERSION:-latest}
        PYTHON_VERSION: ${PYTHON_VERSION:-3.12}
    image: ghcr.io/shuricksumy/mcp-manager:preview
    container_name: ${MCP_PROXY_CONTAINER_NAME:-mcp-manager-preview}
    restart: unless-stopped
    ports:
      - "${MCP_PROXY_PUBLISHED_PORT:-8006}:${MCP_PROXY_PORT:-8000}"
      # admin page (MCP_MANAGER=true)
      - "${MCP_MANAGER_PUBLISHED_PORT:-8016}:${MCP_MANAGER_PORT:-8001}"
    environment:
      MCP_PROXY_HOST: ${MCP_PROXY_HOST:-0.0.0.0}
      MCP_PROXY_PORT: ${MCP_PROXY_PORT:-8000}
      MCP_PROXY_TRANSPORT: ${MCP_PROXY_TRANSPORT:-streamablehttp}
      MCP_PROXY_CONFIG: ${MCP_PROXY_CONFIG:-/mcp/servers.json}
      MCP_PROXY_ALLOWED_HOSTS: ${MCP_PROXY_ALLOWED_HOSTS:-}
      MCP_PROXY_ALLOW_ORIGINS: ${MCP_PROXY_ALLOW_ORIGINS-*}
      MCP_PROXY_PASS_ENV: ${MCP_PROXY_PASS_ENV:-false}
      MCP_PROXY_LOG_LEVEL: ${MCP_PROXY_LOG_LEVEL:-}
      MCP_PROXY_DEBUG: ${MCP_PROXY_DEBUG:-false}
      MCP_PROXY_EXTRA_ARGS: ${MCP_PROXY_EXTRA_ARGS:-}
      MCP_MANAGER: ${MCP_MANAGER:-false}
      MCP_MANAGER_PASSWORD: ${MCP_MANAGER_PASSWORD:-}
      MCP_MANAGER_PORT: ${MCP_MANAGER_PORT:-8001}
      MCP_MANAGER_FRAME_ANCESTORS: ${MCP_MANAGER_FRAME_ANCESTORS:-}
      MCP_PROXY_PUBLISHED_PORT: ${MCP_PROXY_PUBLISHED_PORT:-8006}
      MCP_SUPERVISE: ${MCP_SUPERVISE:-false}
      MCP_SUPERVISE_MAX_RSS: ${MCP_SUPERVISE_MAX_RSS:-}
      MCP_SUPERVISE_HARD_RSS: ${MCP_SUPERVISE_HARD_RSS:-}
      MCP_SUPERVISE_MAX_AGE: ${MCP_SUPERVISE_MAX_AGE:-}
      MCP_SUPERVISE_IDLE_STOP: ${MCP_SUPERVISE_IDLE_STOP:-}
      MCP_SUPERVISE_LOG_INTERVAL: ${MCP_SUPERVISE_LOG_INTERVAL:-}
    # Optional backstop for the whole container (all servers + proxy):
    # mem_limit: 4g
    volumes:
      - ${MCP_CONFIG_DIR:-./data/mcp-preview}:/mcp
