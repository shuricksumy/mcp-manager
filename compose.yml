services:
  mcp-manager:
    # Prebuilt image from GHCR (`docker compose pull`). `docker compose build`
    # builds it locally from this repo instead.
    image: ghcr.io/shuricksumy/mcp-manager:${MCP_PROXY_IMAGE_TAG:-latest}
    build: .
    container_name: ${MCP_PROXY_CONTAINER_NAME:-mcp-manager}
    restart: unless-stopped
    ports:
      - "${MCP_PROXY_PUBLISHED_PORT:-8005}:${MCP_PROXY_PORT:-8000}"
      # admin page (MCP_MANAGER=true)
      - "${MCP_MANAGER_PUBLISHED_PORT:-8015}:${MCP_MANAGER_PORT:-8001}"
    environment:
      MCP_PROXY_HOST: ${MCP_PROXY_HOST:-0.0.0.0}
      MCP_PROXY_PORT: ${MCP_PROXY_PORT:-8000}
      MCP_PROXY_TRANSPORT: ${MCP_PROXY_TRANSPORT:-streamablehttp}
      MCP_PROXY_CONFIG: ${MCP_PROXY_CONFIG:-/mcp/servers.json}
      MCP_PROXY_ALLOWED_HOSTS: ${MCP_PROXY_ALLOWED_HOSTS:-}
      MCP_PROXY_ALLOW_ORIGINS: ${MCP_PROXY_ALLOW_ORIGINS-*}
      MCP_PROXY_PASS_ENV: ${MCP_PROXY_PASS_ENV:-false}
      MCP_PROXY_LOG_LEVEL: ${MCP_PROXY_LOG_LEVEL:-}
      MCP_PROXY_DEBUG: ${MCP_PROXY_DEBUG:-false}
      MCP_PROXY_EXTRA_ARGS: ${MCP_PROXY_EXTRA_ARGS:-}
      MCP_MANAGER: ${MCP_MANAGER:-false}
      MCP_MANAGER_PASSWORD: ${MCP_MANAGER_PASSWORD:-}
      MCP_MANAGER_PORT: ${MCP_MANAGER_PORT:-8001}
      MCP_MANAGER_FRAME_ANCESTORS: ${MCP_MANAGER_FRAME_ANCESTORS:-}
      MCP_PROXY_PUBLISHED_PORT: ${MCP_PROXY_PUBLISHED_PORT:-8005}
      MCP_SUPERVISE: ${MCP_SUPERVISE:-false}
      MCP_SUPERVISE_MAX_RSS: ${MCP_SUPERVISE_MAX_RSS:-}
      MCP_SUPERVISE_HARD_RSS: ${MCP_SUPERVISE_HARD_RSS:-}
      MCP_SUPERVISE_MAX_AGE: ${MCP_SUPERVISE_MAX_AGE:-}
      MCP_SUPERVISE_IDLE_STOP: ${MCP_SUPERVISE_IDLE_STOP:-}
      MCP_SUPERVISE_LOG_INTERVAL: ${MCP_SUPERVISE_LOG_INTERVAL:-}
    # Optional backstop for the whole container (all servers + proxy):
    # mem_limit: 4g
    volumes:
      - ${MCP_CONFIG_DIR:-./data/mcp}:/mcp
